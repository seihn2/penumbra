appId: com.penumbra.app
productName: Penumbra
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
afterPack: scripts/after-pack-mac-sign.cjs
win:
  executableName: Penumbra
  # Explicit targets/arch so the Windows build doesn't just follow the build
  # machine's architecture. Building on an arm64 Mac would otherwise emit only
  # an arm64 installer, leaving the x64 majority of Windows users without a
  # usable package. x64 first (the common case) + arm64 for newer devices.
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  publish: null # Disable automatic updates on macOS.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSAudioCaptureUsageDescription: Penumbra needs to capture system audio to transcribe the interviewer in real time.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: seihn2
  repo: penumbra
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
