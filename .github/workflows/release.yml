name: Build and Release Electron App

on:
  workflow_dispatch:

permissions:
  contents: write # required for creating releases & uploading assets

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Package Electron app
        run: npm run build:${{ matrix.os == 'windows-latest' && 'win' || (matrix.os == 'macos-latest' && 'mac' || 'linux') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A stable signing identity keeps macOS TCC grants (Screen Recording,
          # microphone) valid across app updates. electron-builder accepts a
          # base64-encoded .p12 or certificate URL in MAC_CSC_LINK.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-build-${{ matrix.os }}
          path: dist/** # electron-builder output folder

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Penumbra ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/**/penumbra-*.dmg
            dist/**/penumbra-*.exe
            dist/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
